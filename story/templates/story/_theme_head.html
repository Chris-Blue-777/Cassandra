<script>
(function () {
    try {
        const theme = (
            localStorage.getItem("cassandra.theme")
            || localStorage.getItem("theme")
            || "light"
        );
        if (theme === "dark" || theme === "night") {
            document.documentElement.classList.add("dark-mode");
        }
    } catch (error) {
        // If storage is unavailable, fall back to the default light theme.
    }
}());
</script>
