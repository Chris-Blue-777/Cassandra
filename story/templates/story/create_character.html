<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character</title>
</head>
<body>
    <h1>Create a Character</h1>

    <button onclick="window.location.href='{% url 'cast_page' %}'">Back to Cast</button>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Create Character</button>
    </form>
</body>
</html>
